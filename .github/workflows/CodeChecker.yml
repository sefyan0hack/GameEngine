name: CodeChecker
on: 
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: CodeChecker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl-dev

      - name: Build
        uses: ./.github/actions/Desktop-build
        with:
          compiler: gcc
          build_type: Debug
          build_dir: ${{ github.workspace }}/build
          cmake_flags: -DEG_UNIT_TESTS=ON -DEG_HARDEN=ON

      - name: Run CodeChecker analysis
        id: codechecker
        uses: whisperity/codechecker-analysis-action@v1
        with:
          logfile: ${{ github.workspace }}/build/compile_commands.json

      - name: Upload CodeChecker reports
        if: always() && steps.codechecker.outputs.result-html-dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: codechecker-reports
          path: ${{ steps.codechecker.outputs.result-html-dir }}
          if-no-files-found: warn